name: discover
description: Search Open Library and browse what is trending.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  core_books: any
  core_design_system: any
  core_di: any
  core_feature_flags: any
  core_prelude: any
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: any
  material_ui: ^1.7.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  core_analysis: any
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5

flutter:
  generate: true
