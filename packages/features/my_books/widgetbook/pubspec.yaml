name: my_books_widgetbook
description: The my_books feature in Widgetbook, running against fakes, in each state its screen can be in.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  core_books: any
  core_design_system: any
  core_di: any
  core_feature_flags: any
  core_widgetbook: any
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  material_ui: ^1.7.0
  my_books: any
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
  # A normal dependency, not a dev one, so building the catalogue in
  # packages/app/widgetbook also writes this package's use cases for
  # Widgetbook Cloud.
  widgetbook_generator: ^3.24.0

dev_dependencies:
  build_runner: ^2.16.1
  core_analysis: any
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
