name: bookshelf_widgetbook
description: Every Widgetbook in one app, the design system's and each feature's, for hosting on Widgetbook Cloud and GitHub Pages.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  book_details: any
  book_details_widgetbook: any
  core_books: any
  core_design_system: any
  core_design_system_widgetbook: any
  core_di: any
  core_widgetbook: any
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  my_books: any
  my_books_widgetbook: any

dev_dependencies:
  build_runner: ^2.16.1
  core_analysis: any
  flutter_test:
    sdk: flutter
  widgetbook: ^3.25.0

flutter:
  uses-material-design: true
