name: core_design_system
description: The Bookshelf design system. The design tokens, the theme built on them, shared components and the theme preference.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  core_di: any
  core_storage: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: any
  material_ui: ^1.7.0

dev_dependencies:
  build_runner: ^2.16.1
  core_analysis: any
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5

flutter:
  generate: true
