name: core_books
description: Book domain models, the Open Library catalogue and the user's local shelf.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  core_di: any
  core_network: any
  core_prelude: any
  core_storage: any
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: any

dev_dependencies:
  build_runner: ^2.16.1
  core_analysis: any
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5

flutter:
  generate: true
